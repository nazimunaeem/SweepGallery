name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK and accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDK_MANAGER="$(command -v sdkmanager || ls "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          if [ -n "$SDK_MANAGER" ] && [ -x "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Determine release version
        id: release_tag
        run: |
          RUN_NUM="${{ github.run_number }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            VER_NAME="${TAG#v}"
          else
            TAG="v1.1.${RUN_NUM}"
            VER_NAME="1.1.${RUN_NUM}"
          fi
          VER_CODE=$((100 + RUN_NUM))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VER_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VER_CODE" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        id: build_apk
        run: |
          VER_NAME="${{ steps.release_tag.outputs.version_name }}"
          VER_CODE="${{ steps.release_tag.outputs.version_code }}"
          gradle assembleDebug --no-daemon --stacktrace \
            -PversionName="$VER_NAME" -PversionCode="$VER_CODE" \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Expected APK not found at $APK_PATH"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SweepGallery-APK
          path: ${{ steps.build_apk.outputs.apk_path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: SweepGallery ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.build_apk.outputs.apk_path }}
