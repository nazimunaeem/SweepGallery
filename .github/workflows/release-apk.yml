name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK and accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDK_MANAGER="$(command -v sdkmanager || ls "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          if [ -n "$SDK_MANAGER" ] && [ -x "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Determine release version
        id: release_tag
        run: |
          RUN_NUM="${{ github.run_number }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            VER_NAME="${TAG#v}"
          else
            TAG="v1.1.${RUN_NUM}"
            VER_NAME="1.1.${RUN_NUM}"
          fi
          VER_CODE=$((100 + RUN_NUM))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VER_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VER_CODE" >> "$GITHUB_OUTPUT"

      - name: Build Signed Release APK
        id: build_apk
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            VER_NAME="${{ steps.release_tag.outputs.version_name }}"
            VER_CODE="${{ steps.release_tag.outputs.version_code }}"
            gradle assembleRelease --no-daemon --stacktrace \
              -PversionName="$VER_NAME" -PversionCode="$VER_CODE" \
              -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
            if [ ! -f "$APK_PATH" ]; then
              echo "Expected release APK not found at $APK_PATH"
              exit 1
            fi
            echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
            echo "release_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            echo "Debug APK releases are disabled. Configure RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD secrets to publish app-release.apk." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Release APK workflow artifact
        if: steps.build_apk.outputs.release_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SweepGallery-Release-APK
          path: ${{ steps.build_apk.outputs.apk_path }}

      - name: Publish GitHub Release
        if: steps.build_apk.outputs.release_ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: SweepGallery ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.build_apk.outputs.apk_path }}
